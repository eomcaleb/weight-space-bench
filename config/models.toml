# Models to benchmark through OpenRouter (https://openrouter.ai/models). Slugs checked 2026-11-02.
# name  = results folder;  label = name on the leaderboard;  group = lab (Anthropic / OpenAI get their own colors).
#
# Every model gets the same reasoning effort and output budget, so they are compared under the same conditions.
# If a provider rejects an effort or the 64,000-token budget, the client falls back ("high" / 32,000 tokens) and
# records what was actually used (shown on the leaderboard).

[[model]]
name = "gpt-6.1-sol"
label = "GPT-6.1 Sol"
slug = "openai/gpt-6.1-sol"
group = "OpenAI"
reasoning_effort = "high"
max_output_tokens = 64000

