# Models to benchmark through OpenRouter (https://openrouter.ai/models). `name` is the run folder under results/.
# Slugs checked against the OpenRouter catalogue on 2026-11-02.
# reasoning_effort is sent as OpenRouter's `reasoning.effort`. If a provider rejects "max" or "xhigh", the client
# falls back to "high" and records the effort actually used in the run's state.json and transcript.

[[model]]
name = "gpt-6.1-sol"
slug = "openai/gpt-6.1-sol"
group = "OpenAI"
reasoning_effort = "max"
max_output_tokens = 32000

[[model]]
name = "deepseek-v4.1-flash-1017"
slug = "deepseek/deepseek-v4.1-flash-1017"
group = "DeepSeek"
reasoning_effort = "max"
max_output_tokens = 32000

[[model]]
name = "kimi-k3.1-pro"
slug = "moonshotai/kimi-k3.1-pro"
group = "Moonshot"
reasoning_effort = "high"
max_output_tokens = 32000

[[model]]
name = "muse-wonder"
slug = "meta/muse-wonder"
group = "Meta"
reasoning_effort = "max"
max_output_tokens = 32000

[[model]]
name = "claude-opus-5.5"
slug = "anthropic/claude-opus-5.5"
group = "Anthropic"
reasoning_effort = "max"
max_output_tokens = 32000

[[model]]
name = "claude-sonnet-5.5"
slug = "anthropic/claude-sonnet-5.5"
group = "Anthropic"
reasoning_effort = "max"
max_output_tokens = 32000

